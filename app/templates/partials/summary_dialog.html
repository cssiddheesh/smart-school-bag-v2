<dialog id="summary-dialog" aria-labelledby="summary-title">
  <div class="dialog__body">
    <h2 id="summary-title">Bag packed</h2>
    <dl class="facts" id="summary-facts"></dl>
    <p class="muted small" id="summary-note" hidden></p>
  </div>
  <div class="dialog__actions">
    <a class="btn" id="summary-link" href="#">View session details</a>
    <button type="button" class="btn btn-primary" id="summary-close">Done</button>
  </div>
</dialog>
